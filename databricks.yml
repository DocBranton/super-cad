# Databricks Asset Bundle for the SI CAD Workbench app.
# Deploy: databricks bundle deploy -t dev && databricks bundle run si_cad_workbench -t dev
bundle:
  name: si-cad-workbench

variables:
  serving_endpoint:
    description: Approved Model Serving endpoint used by the SI planner
    # Replace with the endpoint approved for your environment.
    default: databricks-llama-4-maverick
  volume_full_name:
    description: Unity Catalog Volume (catalog.schema.volume) for project storage
    default: workspace.am-foundary.cad_artifacts

resources:
  apps:
    si_cad_workbench:
      # Deploys to the existing app. If the bundle did not create it, bind it once first:
      #   databricks bundle deployment bind si_cad_workbench cad-workbench -t dev
      name: cad-workbench
      description: SI-assisted parametric CAD in the browser
      source_code_path: .
      user_api_scopes:
        - model-serving
        - files
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: volume
          uc_securable:
            securable_full_name: ${var.volume_full_name}
            securable_type: VOLUME
            permission: WRITE_VOLUME

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
