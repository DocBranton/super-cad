# Super CAD initial standalone deployment into existing app 'super-cad'.
# No placeholder serving endpoint or UC Volume is required for first smoke test.
# After live verification, configure governed storage and an approved model endpoint.
bundle:
  name: super-cad

resources:
  apps:
    super_cad:
      name: super-cad
      description: Browser-native SI-assisted parametric CAD
      source_code_path: .

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
